<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Posha Brand Guidelines</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#232222">
  <!-- Link previews still work while the site is locked -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Posha">
  <meta property="og:title" content="Posha Brand Guidelines">
  <meta property="og:description" content="Everything the team needs to design, write and build for Posha.">
  <meta property="og:image" content="https://posha-brand-guidelines.vercel.app/code/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://posha-brand-guidelines.vercel.app/code/og-image.png">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23231F20'/%3E%3Ctext x='16' y='22' font-family='Arial' font-weight='700' font-size='16' fill='%23FFFCF8' text-anchor='middle'%3EP%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/code/gate/gate.css">
</head>
<body>
  <main class="table" id="table" aria-label="Posha Brand Guidelines is locked">
    <p class="corner corner--tl">Posha Brand Guidelines</p>
    <p class="corner corner--bl">Flick the icons</p>

    <img class="body logo" id="logo" src="https://pub-61f336f5041247d4bd3e51e5fd3a1ffb.r2.dev/brand/posha-wordmark-off-white.svg" alt="Posha" draggable="false">

    <form class="body entry" id="entry" autocomplete="off">
      <label class="entry-box">
        <span class="sr">Poshword</span>
        <input id="word" name="word" type="password" placeholder="Enter the Poshword" autocomplete="current-password" spellcheck="false" autocapitalize="off" required>
        <button type="submit" aria-label="Enter"><span class="arrow" aria-hidden="true"></span></button>
      </label>
      <label class="ack">
        <input type="checkbox" id="ack" name="ack">
        <span class="ack-box" aria-hidden="true"></span>
        <span class="ack-text">I know this is about 10% cooked. I’ll taste it as a work in progress, not a finished dish, and help with the recipe instead of sending it back to the kitchen.</span>
      </label>
      <p class="entry-msg" id="msg" role="status" aria-live="polite"></p>
    </form>
  </main>
  <script src="/code/gate/gate.js"></script>
</body>
</html>
