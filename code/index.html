<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Posha Brand Guidelines</title>
  <meta name="description" content="Posha brand guidelines — philosophy, logo, color, typography, gallery and more.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23231F20'/%3E%3Ctext x='16' y='22' font-family='Arial' font-weight='700' font-size='16' fill='%23FFF9F5' text-anchor='middle'%3EP%3C/text%3E%3C/svg%3E">
  <link rel="preload" href="../assets/fonts/EpikaSerifExtraCondensedPremium-Light.otf" as="font" type="font/otf" crossorigin>
  <link rel="preload" href="../assets/fonts/Roobert-Regular.otf" as="font" type="font/otf" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Mobile top bar -->
  <header class="topbar">
    <a class="brand" href="#/" data-brand></a>
    <button class="icon-btn" id="menuBtn" aria-label="Open navigation">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M3 7h18M3 12h18M3 17h18" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>
    </button>
  </header>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="#/" data-brand="on-dark"></a>
    <button class="search-trigger" id="searchBtn" type="button">
      <svg viewBox="0 0 24 24" width="16" height="16"><circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="m16 16 4.5 4.5" stroke="currentColor" stroke-width="1.6"/></svg>
      <span>Search</span>
      <kbd>Ctrl K</kbd>
    </button>
    <nav class="nav" id="nav" aria-label="Guidelines"></nav>
    <div class="sidebar-foot" id="sidebarFoot"></div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <!-- Site-wide search bar (on every page) -->
  <div class="appbar">
    <div class="site-search" id="siteSearch">
      <label class="site-search-box">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="m16 16 4.5 4.5" stroke="currentColor" stroke-width="1.6"/></svg>
        <input id="searchInput" type="search" placeholder="Search the guidelines — try “icons”, “posha yellow”, “renders”, “logo misuse”" autocomplete="off"
          role="combobox" aria-expanded="false" aria-controls="searchResults" aria-label="Search the guidelines">
        <kbd>Ctrl K</kbd>
      </label>
      <ul class="search-results" id="searchResults" role="listbox" hidden></ul>
    </div>
  </div>

  <!-- Content -->
  <main class="main" id="main">
    <div class="loading">Loading…</div>
  </main>

  <!-- Footer + icon playground (same on every page) -->
  <footer class="site-footer" id="siteFooter"></footer>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" hidden>
    <button class="lb-btn lb-close" data-lb="close" aria-label="Close">&times;</button>
    <button class="lb-btn lb-prev" data-lb="prev" aria-label="Previous">&#8592;</button>
    <div class="lb-stage" id="lbStage"></div>
    <button class="lb-btn lb-next" data-lb="next" aria-label="Next">&#8594;</button>
    <div class="lb-bar"><span id="lbCaption"></span><a id="lbOpen" target="_blank" rel="noopener">Open original &#8599;</a></div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="js/app.js"></script>
</body>
</html>
